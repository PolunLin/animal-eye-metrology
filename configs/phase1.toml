# Paths are relative to this configuration file, not the working directory.
[dataset]
name = "COCO 2017 validation (user-declared; provenance must be verified)"
annotations = "../data/coco/annotations/instances_val2017.json"
images = "../data/coco/val2017"
expected_animal_categories = 10
# Optional independently obtained reference digest; empty means no reference comparison.
expected_annotations_sha256 = ""

[output]
directory = "../outputs/phase1"

[contact_sheets]
# Annotation-only analysis is the default. No download occurs in either mode.
enabled = false
columns = 2
rows = 3
panel_width = 320
panel_height = 240
# 0 = every candidate; a positive limit is an ID-ordered preview, not a review sample.
max_images = 0
